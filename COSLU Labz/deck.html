<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>COSLU Labz · Deck Template</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="brand-tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #0a0a0a; overflow: hidden; }
    deck-stage:not(:defined) { visibility: hidden; }
    /* slide sections are 1920x1080 — let the inner React tree fill them */
    deck-stage > section { box-sizing: border-box; position: relative; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="brand.jsx"></script>
  <script type="text/babel" src="site.jsx"></script>
  <script type="text/babel" src="deck.jsx"></script>
</head>
<body>
  <deck-stage width="1920" height="1080">
    <section data-label="01 Title"     id="slot-1"></section>
    <section data-label="02 Agenda"    id="slot-2"></section>
    <section data-label="03 Section"   id="slot-3"></section>
    <section data-label="04 Content"   id="slot-4"></section>
    <section data-label="05 Data"      id="slot-5"></section>
    <section data-label="06 Quote"     id="slot-6"></section>
    <section data-label="07 Image"     id="slot-7"></section>
    <section data-label="08 Process"   id="slot-8"></section>
    <section data-label="09 Compare"   id="slot-9"></section>
    <section data-label="10 Roadmap"   id="slot-10"></section>
    <section data-label="11 Team"      id="slot-11"></section>
    <section data-label="12 Pricing"   id="slot-12"></section>
    <section data-label="13 Logos"     id="slot-13"></section>
    <section data-label="14 Code demo" id="slot-14"></section>
    <section data-label="15 Chart"     id="slot-15"></section>
    <section data-label="16 References" id="slot-16"></section>
    <section data-label="17 Close"     id="slot-17"></section>
  </deck-stage>

  <script src="deck-stage.js"></script>

  <script type="text/babel">
    // Mount each slide's React tree into its <section> slot.
    // Sections must remain DIRECT children of <deck-stage>, so we render
    // INTO them, not around them.
    const slides = [
      SlideTitle, SlideAgenda, SlideSection, SlideContent,
      SlideData, SlideQuote, SlideImage, SlideTwoCol,
      SlideCompare, SlideRoadmap, SlideTeam, SlidePricing,
      SlideLogoWall, SlideCodeDemo, SlideChart, SlideReferences,
      SlideClose,
    ];
    slides.forEach((Comp, i) => {
      const slot = document.getElementById(`slot-${i + 1}`);
      if (slot) ReactDOM.createRoot(slot).render(<Comp />);
    });
  </script>
</body>
</html>
